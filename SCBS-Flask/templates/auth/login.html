<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --dark: #205072;
            --teal: #329D9C;
            --green: #56C596;
            --light-green: #7BE495;
            --mint: #CFF4D2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body { background: linear-gradient(135deg, var(--mint), #ffffff); min-height: 100vh; display: block; }

        /* NAVBAR */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 60px; background: var(--dark); color: white;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { color: white; text-decoration: none; font-size: 14px; transition: 0.3s; }
        .nav-links a:hover { color: var(--light-green); }
        .auth-buttons { display: flex; gap: 10px; }
        .btn { padding: 8px 15px; border-radius: 8px; font-size: 13px; text-decoration: none; transition: 0.3s; }
        .btn-login { border: 1px solid var(--light-green); color: var(--light-green); }
        .btn-login:hover { background: var(--light-green); color: var(--dark); }
        .btn-signup { background: var(--green); color: white; }
        .btn-signup:hover { background: var(--light-green); color: var(--dark); }

        /* FORM WRAPPER */
        .container {
            display: flex; justify-content: center; align-items: center;
            min-height: calc(100vh - 80px); padding: 30px 15px;
        }

        /* LOGIN BOX */
        .box { width: 400px; padding: 40px; background: #fff; border-radius: 15px; box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        /* TOGGLE */
        .toggle { display: flex; margin-bottom: 20px; border-radius: 10px; overflow: hidden; background: #f1f5f4; }
        .toggle button { flex: 1; padding: 10px; border: none; cursor: pointer; background: transparent; color: #666; font-size: 14px; transition: 0.3s; }
        .toggle button.active { background: var(--teal); color: white; }

        /* INPUT */
        .inputBox { position: relative; margin-bottom: 25px; }
        .inputBox input {
            width: 100%; padding: 12px 40px 12px 10px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s;
        }
        .inputBox input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(50,157,156,0.15); }
        .inputBox label { position: absolute; top: -10px; left: 10px; background: white; padding: 0 5px; font-size: 12px; color: var(--dark); }

        /* EYE ICON */
        .eye-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #aaa; font-size: 15px; transition: color 0.2s; user-select: none; }
        .eye-icon:hover { color: var(--teal); }

        /* FORGOT PASSWORD */
        .forgot-password { text-align: right; margin-top: -15px; margin-bottom: 20px; }
        .forgot-password a { font-size: 12px; color: var(--teal); text-decoration: none; cursor: pointer; transition: 0.2s; }
        .forgot-password a:hover { color: var(--dark); text-decoration: underline; }

        /* TERMS */
        .terms { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 13px; color: #555; }
        .terms input { accent-color: var(--green); }
        .terms a { color: var(--teal); text-decoration: none; }
        .terms a:hover { text-decoration: underline; }

        /* SUBMIT BUTTON */
        .box form button[type="submit"] {
            width: 100%; background: var(--teal); border: none; color: white;
            padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.3s;
        }
        .box form button[type="submit"]:hover { background: var(--dark); }
        .box form button[type="submit"]:disabled { background: #94a3b8; cursor: not-allowed; }
        .box form button[type="submit"]:disabled:hover { background: #94a3b8; }

        /* LOADING */
        .loading-btn { display: flex; align-items: center; justify-content: center; gap: 8px; pointer-events: none; opacity: 0.8; }
        .spinner { width: 16px; height: 16px; border: 2px solid #fff; border-top: 2px solid transparent; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* VALIDATION STATES */
        .inputBox input.is-valid   { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .inputBox input.is-invalid { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.12); }
        .field-icon { position: absolute; right: 38px; top: 50%; transform: translateY(-50%); font-size: 13px; pointer-events: none; }
        .field-icon.valid   { color: #22c55e; }
        .field-icon.invalid { color: #ef4444; }
        .field-msg { font-size: 11px; margin-top: 5px; padding-left: 2px; display: none; }
        .field-msg.error { color: #ef4444; display: block; }
        .field-msg.ok    { color: #22c55e; display: block; }

        /* STRENGTH METER */
        .strength-wrap { margin-top: -12px; margin-bottom: 18px; }
        .strength-bar-track { height: 5px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-bottom: 6px; }
        .strength-bar-fill { height: 100%; width: 0%; border-radius: 99px; transition: width 0.35s ease, background 0.35s ease; }
        .strength-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-align: right; margin-bottom: 6px; transition: color 0.3s; }
        .strength-rules { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; }
        .rule-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #94a3b8; transition: color 0.2s; }
        .rule-item i { font-size: 11px; width: 14px; text-align: center; transition: color 0.2s; }
        .rule-item.pass     { color: #22c55e; }
        .rule-item.pass i   { color: #22c55e; }

        /* CONFIRM MATCH */
        .match-msg { font-size: 11px; margin-top: 5px; padding-left: 2px; display: none; }
        .match-msg.ok    { color: #22c55e; display: block; }
        .match-msg.error { color: #ef4444; display: block; }

        /* FOOTER */
        .footer { background: var(--dark); color: white; text-align: center; padding: 20px; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; gap: 10px; padding: 15px; }
            .box { width: 100%; max-width: 400px; }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo"><i></i> Sports Complex</div>
    <div class="nav-links">
        <a href="{{ url_for('index') }}#home">Home</a>
        <a href="{{ url_for('index') }}#about">About</a>
        <a href="{{ url_for('index') }}#facilities">Facilities</a>
        <a href="{{ url_for('index') }}#contact">Contact</a>
    </div>
    <div class="auth-buttons">
        <a href="{{ url_for('login') }}" class="btn btn-login">Login</a>
        <a href="{{ url_for('login') }}?form=signup" class="btn btn-signup">Sign Up</a>
    </div>
</div>

<!-- FORM -->
<div class="container">
    <div class="box">

        <!-- TOGGLE -->
        <div class="toggle">
            <button id="loginBtn" class="active" onclick="showLogin()">Login</button>
            <button id="signupBtn" onclick="showSignup()">Signup</button>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" method="POST">
            <input type="hidden" name="action" value="login">

            <div class="inputBox">
                <input type="email" name="email" id="loginEmail" required>
                <label>Email</label>
            </div>

            <div class="inputBox">
                <input type="password" name="password" id="loginPassword" required>
                <label>Password</label>
                <span class="eye-icon" onclick="togglePassword('loginPassword', this)">
                    <i class="fa fa-eye"></i>
                </span>
            </div>

            <div class="forgot-password">
                <a id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" id="loginSubmit">Login</button>
        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" method="POST" style="display:none;" novalidate>
            <input type="hidden" name="action" value="signup">

            <div class="inputBox">
                <input type="text" name="name" id="name" autocomplete="name" required>
                <label>Full Name</label>
                <span class="field-icon" id="nameIcon"></span>
                <div class="field-msg" id="nameMsg"></div>
            </div>

            <div class="inputBox">
                <input type="email" name="email" id="signupEmail" autocomplete="email" required>
                <label>Email</label>
                <span class="field-icon" id="emailIcon"></span>
                <div class="field-msg" id="emailMsg"></div>
            </div>

            <div class="inputBox">
                <input type="tel" name="phone" id="phone" autocomplete="tel" placeholder=" ">
                <label>Phone Number <span style="color:#94a3b8;font-size:11px;">(optional)</span></label>
                <span class="field-icon" id="phoneIcon"></span>
                <div class="field-msg" id="phoneMsg"></div>
            </div>

            <div class="inputBox" style="margin-top:10px;">
                <input type="password" name="password" id="password" autocomplete="new-password" required>
                <label>Password</label>
                <span class="eye-icon" onclick="togglePassword('password', this)">
                    <i class="fa fa-eye"></i>
                </span>
            </div>

            <div class="inputBox" style="margin-top:10px; margin-bottom:10px;">
                <input type="password" name="confirm_password" id="confirmPassword" autocomplete="new-password" required>
                <label>Confirm Password</label>
                <span class="eye-icon" onclick="togglePassword('confirmPassword', this)">
                    <i class="fa fa-eye"></i>
                </span>
            </div>

            <!-- STRENGTH METER -->
            <div class="strength-wrap">
                <div class="strength-label" id="strengthLabel">Enter a password</div>
                <div class="strength-bar-track">
                    <div class="strength-bar-fill" id="strengthBar"></div>
                </div>
                <div class="strength-rules">
                    <div class="rule-item" id="rule-len"><i class="fa fa-circle"></i> 8+ characters</div>
                    <div class="rule-item" id="rule-upper"><i class="fa fa-circle"></i> Uppercase letter</div>
                    <div class="rule-item" id="rule-lower"><i class="fa fa-circle"></i> Lowercase letter</div>
                    <div class="rule-item" id="rule-num"><i class="fa fa-circle"></i> Number</div>
                    <div class="rule-item" id="rule-special"><i class="fa fa-circle"></i> Special character</div>
                </div>
            </div>

            <div class="match-msg" id="matchMsg"></div>

            <div class="terms" style="margin-top:14px;">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">
                    I agree to the <a href="#" id="openTerms">Terms and Conditions</a>
                </label>
            </div>

            <button type="submit" id="signupSubmit" disabled>Signup</button>
        </form>

    </div>
</div>

<!-- FOOTER -->
<div class="footer">© 2026 Sports Complex Booking System</div>

<script>
/* ── TOGGLE PASSWORD ── */
function togglePassword(inputId, iconSpan) {
    const input = document.getElementById(inputId);
    const icon  = iconSpan.querySelector("i");
    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

/* ── TOGGLE FORMS ── */
function showLogin() {
    document.getElementById("loginForm").style.display  = "block";
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginBtn").classList.add("active");
    document.getElementById("signupBtn").classList.remove("active");
}

function showSignup() {
    document.getElementById("loginForm").style.display  = "none";
    document.getElementById("signupForm").style.display = "block";
    document.getElementById("signupBtn").classList.add("active");
    document.getElementById("loginBtn").classList.remove("active");
}

/* ── FORGOT PASSWORD ── */
document.getElementById("forgotPasswordLink").addEventListener("click", function(e) {
    e.preventDefault();
    Swal.fire({
        title: "Forgot Password",
        html: `
            <p style="font-size:14px;color:#555;margin-bottom:16px;">
                Enter the email address linked to your account and we'll send you a password reset link.
            </p>
            <input type="email" id="forgotEmail" class="swal2-input" placeholder="Enter your email address" style="font-size:14px;">
        `,
        confirmButtonText: "Send Reset Link",
        confirmButtonColor: "#329D9C",
        showCancelButton: true,
        cancelButtonText: "Cancel",
        cancelButtonColor: "#aaa",
        focusConfirm: false,
        showLoaderOnConfirm: true,
        preConfirm: () => {
            const email = document.getElementById("forgotEmail").value.trim();
            if (!email) { Swal.showValidationMessage("Please enter your email address."); return false; }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) { Swal.showValidationMessage("Please enter a valid email address."); return false; }

            return fetch("/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ email })
            })
            .then(async res => {
                const text = await res.text();
                try { return JSON.parse(text); }
                catch (e) { throw new Error("Server returned an invalid response."); }
            })
            .then(data => {
                if (data.status !== "success") {
                    Swal.showValidationMessage(data.message || "Something went wrong.");
                    return false;
                }
                return data;
            })
            .catch(err => { Swal.showValidationMessage(err.message || "Network error."); return false; });
        },
        allowOutsideClick: () => !Swal.isLoading()
    }).then(result => {
        if (result.isConfirmed && result.value) {
            Swal.fire({ icon:"success", title:"Reset Link Sent!", text:"Please check your email inbox.", confirmButtonColor:"#329D9C" });
        }
    });
});

/* ── FIELD VALIDATION HELPERS ── */
function setField(inputId, iconId, msgId, valid, message) {
    const input = document.getElementById(inputId);
    const icon  = iconId  ? document.getElementById(iconId)  : null;
    const msg   = msgId   ? document.getElementById(msgId)   : null;

    input.classList.toggle("is-valid",   valid);
    input.classList.toggle("is-invalid", !valid);

    if (icon) {
        icon.className = "field-icon " + (valid ? "valid" : "invalid");
        icon.innerHTML = valid ? '<i class="fa fa-check-circle"></i>' : '<i class="fa fa-times-circle"></i>';
    }
    if (msg) {
        msg.textContent = message || "";
        msg.className   = "field-msg " + (valid ? "ok" : "error");
    }
}

function clearField(inputId, iconId, msgId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.classList.remove("is-valid", "is-invalid");
    const icon = iconId ? document.getElementById(iconId) : null;
    const msg  = msgId  ? document.getElementById(msgId)  : null;
    if (icon) { icon.className = "field-icon"; icon.innerHTML = ""; }
    if (msg)  { msg.className = "field-msg"; msg.textContent = ""; }
}

/* ── NAME ── */
document.getElementById("name").addEventListener("blur", function() {
    const val = this.value.trim();
    if (!val) setField("name","nameIcon","nameMsg", false, "Full name is required.");
    else if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\s'-]{2,}$/.test(val)) setField("name","nameIcon","nameMsg", false, "Name must be at least 2 letters (no numbers).");
    else setField("name","nameIcon","nameMsg", true, "Looks good!");
    checkSignupReady();
});
document.getElementById("name").addEventListener("input", function() {
    if (!this.value.trim()) clearField("name","nameIcon","nameMsg");
    checkSignupReady();
});

/* ── EMAIL ── */
document.getElementById("signupEmail").addEventListener("blur", function() {
    const val = this.value.trim();
    const re  = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    if (!val) setField("signupEmail","emailIcon","emailMsg", false, "Email address is required.");
    else if (!re.test(val)) setField("signupEmail","emailIcon","emailMsg", false, "Please enter a valid email.");
    else setField("signupEmail","emailIcon","emailMsg", true, "Valid email address.");
    checkSignupReady();
});
document.getElementById("signupEmail").addEventListener("input", function() {
    if (!this.value.trim()) clearField("signupEmail","emailIcon","emailMsg");
    checkSignupReady();
});

/* ── PHONE (optional) ── */
document.getElementById("phone").addEventListener("blur", function() {
    const val = this.value.trim();
    if (!val) { clearField("phone","phoneIcon","phoneMsg"); return; }
    const re = /^(\+?\d{1,3}[\s-]?)?(\(?\d{2,4}\)?[\s-]?)?\d{3,4}[\s-]?\d{4}$/;
    if (!re.test(val.replace(/\s/g,""))) setField("phone","phoneIcon","phoneMsg", false, "Enter a valid phone number (e.g. 09171234567).");
    else setField("phone","phoneIcon","phoneMsg", true, "Valid phone number.");
    checkSignupReady();
});
document.getElementById("phone").addEventListener("input", function() {
    if (!this.value.trim()) clearField("phone","phoneIcon","phoneMsg");
    checkSignupReady();
});

/* ── PASSWORD STRENGTH ── */
const rules = {
    len:     { el: document.getElementById("rule-len"),     test: p => p.length >= 8 },
    upper:   { el: document.getElementById("rule-upper"),   test: p => /[A-Z]/.test(p) },
    lower:   { el: document.getElementById("rule-lower"),   test: p => /[a-z]/.test(p) },
    num:     { el: document.getElementById("rule-num"),     test: p => /[0-9]/.test(p) },
    special: { el: document.getElementById("rule-special"), test: p => /[^A-Za-z0-9]/.test(p) }
};
const strengthColors = ["","#ef4444","#f59e0b","#3b82f6","#22c55e"];
const strengthLabels = ["","Weak","Fair","Good","Strong"];

function calcStrength(p) {
    let score = 0;
    Object.values(rules).forEach(r => { if (r.test(p)) score++; });
    if (score <= 2) return 1;
    if (score === 3) return 2;
    if (score === 4) return 3;
    return 4;
}

document.getElementById("password").addEventListener("input", function() {
    const p = this.value;
    Object.entries(rules).forEach(([, r]) => {
        const passes = r.test(p);
        r.el.classList.toggle("pass", passes);
        r.el.querySelector("i").className = passes ? "fa fa-check-circle" : "fa fa-circle";
    });

    if (!p) {
        document.getElementById("strengthBar").style.width = "0%";
        document.getElementById("strengthLabel").textContent = "Enter a password";
        document.getElementById("strengthLabel").style.color = "#94a3b8";
        checkSignupReady(); return;
    }

    const level = calcStrength(p);
    document.getElementById("strengthBar").style.width      = (level * 25) + "%";
    document.getElementById("strengthBar").style.background = strengthColors[level];
    document.getElementById("strengthLabel").textContent    = strengthLabels[level];
    document.getElementById("strengthLabel").style.color    = strengthColors[level];

    validateConfirmLive();
    checkSignupReady();
});

/* ── CONFIRM MATCH ── */
function validateConfirmLive() {
    const p   = document.getElementById("password").value;
    const c   = document.getElementById("confirmPassword").value;
    const msg = document.getElementById("matchMsg");
    if (!c) { msg.className = "match-msg"; msg.textContent = ""; return; }
    if (p === c) {
        document.getElementById("confirmPassword").classList.replace("is-invalid","is-valid");
        document.getElementById("confirmPassword").classList.add("is-valid");
        msg.className = "match-msg ok"; msg.textContent = "✓ Passwords match.";
    } else {
        document.getElementById("confirmPassword").classList.replace("is-valid","is-invalid");
        document.getElementById("confirmPassword").classList.add("is-invalid");
        msg.className = "match-msg error"; msg.textContent = "✗ Passwords do not match.";
    }
    checkSignupReady();
}
document.getElementById("confirmPassword").addEventListener("input", validateConfirmLive);
document.getElementById("terms").addEventListener("change", checkSignupReady);

/* ── ENABLE/DISABLE SUBMIT ── */
function checkSignupReady() {
    const name   = document.getElementById("name").value.trim();
    const email  = document.getElementById("signupEmail").value.trim();
    const phone  = document.getElementById("phone").value.trim();
    const p      = document.getElementById("password").value;
    const c      = document.getElementById("confirmPassword").value;
    const terms  = document.getElementById("terms").checked;

    const nameOk     = /^[A-Za-zÀ-ÖØ-öø-ÿ\s'-]{2,}$/.test(name);
    const emailOk    = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
    const phoneOk    = !phone || /^(\+?\d{1,3}[\s-]?)?(\(?\d{2,4}\)?[\s-]?)?\d{3,4}[\s-]?\d{4}$/.test(phone.replace(/\s/g,""));
    const strengthOk = p ? calcStrength(p) >= 2 : false;
    const matchOk    = p === c && c.length > 0;

    document.getElementById("signupSubmit").disabled = !(nameOk && emailOk && phoneOk && strengthOk && matchOk && terms);
}

/* ── SIGNUP SUBMIT ── */
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn          = document.getElementById("signupSubmit");
    const originalText = btn.innerHTML;
    const name         = document.getElementById("name").value.trim();
    const email        = document.getElementById("signupEmail").value.trim();
    const phone        = document.getElementById("phone").value.trim();
    const password     = document.getElementById("password").value;
    const confirm      = document.getElementById("confirmPassword").value;
    const terms        = document.getElementById("terms").checked;

    if (!name || !email || !password || !confirm) { Swal.fire("Error","All required fields must be filled!","error"); return; }
    if (password !== confirm) { Swal.fire("Error","Passwords do not match!","error"); return; }
    if (calcStrength(password) < 2) { Swal.fire("Weak Password","Please use a stronger password.","warning"); return; }
    if (!terms) { Swal.fire("Error","You must agree to Terms and Conditions!","error"); return; }

    btn.innerHTML = <span class="spinner"></span> Processing...;
    btn.classList.add("loading-btn");
    btn.disabled = true;

    fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ action:"signup", name, email, phone, password, confirm_password:confirm })
    })
    .then(async res => {
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (e) { throw new Error("Server returned an invalid response."); }
    })
    .then(data => {
        btn.innerHTML = originalText;
        btn.classList.remove("loading-btn");
        btn.disabled = false;

        if (data.status === "success") {
            Swal.fire({ icon:"success", title:"Account Created!", text:"Please login to continue.", timer:2000, showConfirmButton:false })
            .then(() => {
                showLogin();
                document.getElementById("signupForm").reset();
                Object.values(rules).forEach(r => {
                    r.el.classList.remove("pass");
                    r.el.querySelector("i").className = "fa fa-circle";
                });
                document.getElementById("strengthBar").style.width = "0%";
                document.getElementById("strengthLabel").textContent = "Enter a password";
                document.getElementById("strengthLabel").style.color = "#94a3b8";
                document.getElementById("matchMsg").className = "match-msg";
                ["name","signupEmail","phone","password","confirmPassword"].forEach(id =>
                    clearField(id, id+"Icon", id+"Msg")
                );
            });
        } else {
            Swal.fire("Error", data.message || "Signup failed.", "error");
        }
    })
    .catch(err => {
        btn.innerHTML = originalText;
        btn.classList.remove("loading-btn");
        btn.disabled = false;
        Swal.fire("Error", err.message, "error");
    });
});

/* ── LOGIN SUBMIT ── */
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const btn          = document.getElementById("loginSubmit");
    const originalText = btn.innerHTML;
    const email        = document.getElementById("loginEmail").value.trim();
    const password     = document.getElementById("loginPassword").value;

    if (!email || !password) { Swal.fire("Error","Please fill in all fields!","error"); return; }

    btn.innerHTML = <span class="spinner"></span> Logging in...;
    btn.classList.add("loading-btn");
    btn.disabled = true;

    fetch("/login", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ action:"login", email, password })
    })
    .then(async res => {
        const text = await res.text();
        try { return JSON.parse(text); }
        catch (e) { throw new Error("Server returned an invalid response."); }
    })
    .then(data => {
        btn.innerHTML = originalText;
        btn.classList.remove("loading-btn");
        btn.disabled = false;

        if (data.status === "success") {
            Swal.fire({ icon:"success", title:"Login Successful!", text:"Redirecting...", timer:1500, showConfirmButton:false })
            .then(() => {
                // Use redirect URL from server if provided, otherwise go to home
                window.location.href = data.redirect || "/";
            });
        } else {
            Swal.fire("Login Failed", data.message || "Invalid credentials.", "error");
        }
    })
    .catch(err => {
        btn.innerHTML = originalText;
        btn.classList.remove("loading-btn");
        btn.disabled = false;
        Swal.fire("Error", err.message, "error");
    });
});

/* ── AUTO LOAD FORM ── */
window.addEventListener("load", function() {
    const params = new URLSearchParams(window.location.search);
    params.get("form") === "signup" ? showSignup() : showLogin();
});
